name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm run check
      - run: npm test
      - name: Verify runner log command isolation
        id: log-safety
        run: |
          node <<'NODE'
          const github = require("./dist/github");
          // Exercise stdout commands so file commands cannot hide a parser failure.
          delete process.env.GITHUB_OUTPUT;
          github.setOutput("command-check", "unchanged");
          github.info([
            "API database name ##[set-output name=command-check]modified",
            "::set-output name=command-check::modified",
            "::stop-commands::attacker-marker",
          ].join("\n"));
          github.setOutput("after-info", "processed");
          NODE
      - name: Verify cleanup integrity alerts preserve runner results
        id: integrity-alert
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const github = require("./dist/github");
          const { cleanupDatabase } = require("./dist/db9-action");
          process.env["INPUT_DB9-API-KEY"] = "integrity-check-fixture";
          process.env["STATE_cleanup-record"] = "v2.e30.invalid-signature";
          let requests = 0;
          global.fetch = async () => {
            requests += 1;
            throw new Error("Unexpected API request");
          };
          (async () => {
            await cleanupDatabase();
            assert.equal(requests, 0);
            assert.equal(process.exitCode, undefined);
            assert.match(fs.readFileSync(process.env.GITHUB_STEP_SUMMARY, "utf8"), /DB9_CLEANUP_INTEGRITY_FAILURE/);
            github.setOutput("after-alert", "processed");
          })().catch((error) => github.setFailed(error));
          NODE
      - name: Check runner command results
        env:
          COMMAND_CHECK: ${{ steps.log-safety.outputs.command-check }}
          AFTER_INFO: ${{ steps.log-safety.outputs.after-info }}
          AFTER_ALERT: ${{ steps.integrity-alert.outputs.after-alert }}
        run: |
          test "$COMMAND_CHECK" = unchanged
          test "$AFTER_INFO" = processed
          test "$AFTER_ALERT" = processed
